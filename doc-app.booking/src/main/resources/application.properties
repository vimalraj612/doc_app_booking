spring.application.name=doc-app.booking

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/doc_app_booking
spring.datasource.username=bengine
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# Flyway disabled due to PostgreSQL 16.8 compatibility issue
spring.flyway.enabled=false

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=vimalraj612@gmail.com
spring.mail.password=qvkuvmkpqcntnrpg
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email Notification Configuration
email.notification.reminder.days-before=3
email.notification.reminder.time=08:00
email.notification.daily-digest.time=07:00

# Application Base URL
app.base-url=http://localhost:8080

# Swagger/OpenAPI enabled for documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Disable Spring Cloud Config to prevent remote configuration loading
spring.cloud.config.enabled=false
spring.cloud.config.discovery.enabled=false

# Disable any remote configuration fetching
management.endpoints.web.exposure.include=health,info

# Disable only swagger resource mappings, not all mappings
spring.webmvc.throw-exception-if-no-handler-found=true

# Slots generator defaults (days ahead and cron expression)
slots.generator.days-ahead=7
slots.generator.cron=0 0 2 * * *

# WhatsApp Business API Configuration
whatsapp.api.url=https://graph.facebook.com/v18.0
whatsapp.api.token=${WHATSAPP_API_TOKEN:your_whatsapp_api_token_here}
whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID:your_phone_number_id_here}
whatsapp.verify.token=${WHATSAPP_VERIFY_TOKEN:your_verify_token_here}
whatsapp.booking.number=${WHATSAPP_BOOKING_NUMBER:+919876543210}

# JWT Configuration
jwt.secret=${JWT_SECRET:DocAppBookingSecretKeyForJWTTokenGenerationThatNeedsToBeAtLeast256BitsLongForHS256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Phone Number Configuration
# Default country code (e.g., +91 for India, +1 for USA, +44 for UK)
app.phone.default-country-code=+91
# Minimum length of phone number including country code digits
app.phone.min-length=10
# Maximum length of phone number including country code digits
app.phone.max-length=15
# Length of phone number without country code
app.phone.number-length=10
# Whether to automatically add country code if not present
app.phone.auto-add-country-code=false
# Supported country codes (comma-separated)
app.phone.supported-country-codes=+91,+1,+44,+61,+86,+81,+65,+49,+33,+39
